name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Compile metallib (航的液态玻璃着色器)
        run: |
          set -eo pipefail
          # iOS 17 运行时只支持到 MSL 3.x；显式把部署目标降到 15.0（必要时退回 2.2）
          xcrun -sdk iphoneos metal -miphoneos-version-min=15.0 -c shader/glass.metal -o /tmp/glass.air \
            || xcrun -sdk iphoneos metal -std=ios-metal2.2 -c shader/glass.metal -o /tmp/glass.air
          xcrun -sdk iphoneos metallib /tmp/glass.air -o default.metallib
          ls -l default.metallib

      - name: Build dylib (arm64 + arm64e)
        run: |
          set -eo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -fobjc-arc -O2 -isysroot "$SDK" \
              -target ${ARCH}-apple-ios15.0 -dynamiclib \
              -framework Foundation -framework UIKit -framework Metal -framework MetalKit \
              -framework QuartzCore -framework CoreFoundation \
              -Wl,-undefined,dynamic_lookup \
              -Wl,-install_name,@loader_path/SBXDesktop.dylib \
              -o SBXDesktop-${ARCH}.dylib src/SBXDesktop.mm
          done
          xcrun lipo -create -output SBXDesktop.dylib SBXDesktop-arm64.dylib SBXDesktop-arm64e.dylib
          xcrun codesign --force --sign - SBXDesktop.dylib
          xcrun lipo -info SBXDesktop.dylib

      - name: Build prefs bundle executable (arm64 + arm64e)
        run: |
          set -eo pipefail
          mkdir -p bin
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -fobjc-arc -O2 -isysroot "$SDK" \
              -target ${ARCH}-apple-ios15.0 -bundle \
              -framework Foundation -framework UIKit \
              -Wl,-undefined,dynamic_lookup \
              -o bin/SBXDesktopPrefs-${ARCH} prefs/SBXDesktopPrefs.mm
          done
          xcrun lipo -create -output bin/SBXDesktopPrefs bin/SBXDesktopPrefs-arm64 bin/SBXDesktopPrefs-arm64e
          xcrun codesign --force --sign - bin/SBXDesktopPrefs
          xcrun lipo -info bin/SBXDesktopPrefs

      - name: 校验（真 arm64e 判据 cpusubtype==0x80000002）
        run: |
          python3 - <<'EOF'
          import struct
          def check_fat(path):
              d = open(path, "rb").read()
              magic = struct.unpack_from(">I", d, 0)[0]
              if magic != 0xcafebabe:
                  raise SystemExit(f"{path}: not a FAT Mach-O")
              n = struct.unpack_from(">I", d, 4)[0]
              subs = []
              for i in range(n):
                  off = 8 + i * 20
                  cpu, sub, pos, size, align = struct.unpack_from(">IIIII", d, off)
                  subs.append(sub)
                  print(path, i, "cpu", hex(cpu), "sub", hex(sub), "offset", hex(pos), "size", size)
              if 0x80000002 not in subs:
                  raise SystemExit(f"{path}: missing arm64e subtype")
          check_fat("SBXDesktop.dylib")
          check_fat("bin/SBXDesktopPrefs")
          EOF
          xcrun lipo -info SBXDesktop.dylib

      - name: Package deb
        run: |
          set -eo pipefail
          python3 tools/ci_package.py --artifacts "$PWD" --output Feature-1.0.5_iphoneos-arm64e.deb
          python3 tools/ci_validate_deb.py Feature-1.0.5_iphoneos-arm64e.deb
          sha256sum Feature-1.0.5_iphoneos-arm64e.deb

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: feature-1.0.5
          path: |
            SBXDesktop.dylib
            bin/SBXDesktopPrefs
            default.metallib
            Feature-1.0.5_iphoneos-arm64e.deb
          if-no-files-found: error
